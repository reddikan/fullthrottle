plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reddikan.fullthrottle'
    compileSdk 34

    defaultConfig {
        applicationId 'com.reddikan.fullthrottle'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }

    signingConfigs {
        // Fixed key kept in the repo so every build installs over the previous one.
        release {
            storeFile file('fullthrottle.keystore')
            storePassword 'fullthrottle'
            keyAlias 'fullthrottle'
            keyPassword 'fullthrottle'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
