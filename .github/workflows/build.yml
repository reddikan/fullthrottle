name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/fullthrottle_v1.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: fullthrottle_v1
          path: dist/fullthrottle_v1.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/fullthrottle_v1.apk media/*.png \
            --title "Full Throttle (latest build)" \
            --notes "Look test build. Download fullthrottle_v1.apk on your Retroid Pocket 5 and open it to install. Built from ${GITHUB_SHA::7}."
